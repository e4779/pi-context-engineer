name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Verify
        run: npm test
      # Benchmark is informational only: model/machine variance is expected,
      # so it never fails CI. Regressions are tracked by comparing retained
      # artifacts (bench/results/*.json), not by gating merges on bench output.
      - name: Benchmark
        run: npm run bench
        continue-on-error: true
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: context-benchmark
          path: .tmp/context-benchmark.json
